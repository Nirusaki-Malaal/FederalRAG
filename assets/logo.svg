<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fedblue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="600" height="120" fill="#0b1120" rx="10"/>
  <!-- Geometric pillar and vector node glyph -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="70" height="70" fill="none" stroke="url(#fedblue)" stroke-width="2" rx="6"/>
    <!-- Pillar columns -->
    <line x1="16" y1="20" x2="16" y2="52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="20" x2="35" y2="52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="20" x2="54" y2="52" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Top & bottom pediments -->
    <line x1="10" y1="18" x2="60" y2="18" stroke="url(#fedblue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="54" x2="60" y2="54" stroke="url(#fedblue)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="125" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">FEDERAL-RAG</text>
  <text x="127" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">FORENSIC LEGAL RECORD RETRIEVAL AND CITATION ENGINE</text>
  <line x1="125" y1="92" x2="570" y2="92" stroke="#1e293b" stroke-width="1.5"/>
</svg>
